# LLM 백엔드 설정 — System2 Planner
#
# shell export 환경변수로 오버라이드 가능:
#   export OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
#   export OPENROUTER_API_KEY=sk-or-v1-...

# 기본 백엔드 (ollama | openrouter)
default_backend: ollama

backends:
  ollama:
    model: "qwen2.5:7b"
    timeout: 10.0
    max_retries: 1
    supports_tools: null  # null = 미확인, true/false = 명시적
    supports_structured_output: false

  openrouter:
    model: "openai/gpt-oss-120b:free"
    timeout: 10.0
    max_retries: 1
    supports_tools: null
    supports_structured_output: false
